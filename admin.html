<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>상담 예약 관리</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>상담 예약 관리</h1>
      <p>현재 예약된 상담을 날짜별로 봅니다.</p>
      <div class="demo" id="demoNote" hidden>데모 모드: 이 브라우저에 저장된 데모 예약을 보여줍니다. 비밀번호는 아무거나 입력하세요.</div>
    </header>

    <section class="card" id="loginCard" style="margin-top:20px">
      <form id="loginForm" autocomplete="off">
        <div class="row">
          <label for="adminPw">관리자 비밀번호</label>
          <input id="adminPw" type="password" required>
        </div>
        <div class="actions"><button class="btn primary" type="submit">들어가기</button></div>
      </form>
      <div class="msg err" id="loginMsg"></div>
    </section>

    <section class="card" id="listCard" style="margin-top:20px" hidden>
      <div class="toolbar">
        <span class="summary" id="summary"></span>
        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap">
          <label><input type="checkbox" id="showAll"> 취소·지난 예약도 보기</label>
          <button class="btn small" id="refresh" type="button">새로고침</button>
          <button class="btn small" id="logout" type="button">나가기</button>
        </div>
      </div>
      <div class="msg err" id="listMsg"></div>
      <div id="list"></div>
    </section>
  </div>

  <script src="config.js?v=2"></script>
  <script src="admin.js?v=2"></script>
</body>
</html>
